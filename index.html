<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootcamp</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(160deg, #1a3a4a 0%, #0d1f28 100%);
      color: #f0ebe3;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    label {
      font-size: 1rem;
      color: #a8c0cc;
    }

    input {
      width: min(320px, 80vw);
      padding: 0.75rem 1rem;
      font-size: 1.1rem;
      font-family: inherit;
      border: 1px solid #3d6a7a;
      border-radius: 6px;
      background: #132a35;
      color: #f0ebe3;
      outline: none;
    }

    input:focus {
      border-color: #6eb5c9;
    }

    input::placeholder {
      color: #5a7a88;
    }

    p#greeting {
      font-size: 1.4rem;
      min-height: 1.6em;
      color: #6eb5c9;
    }
  </style>
</head>
<body>
  <h1>Bootcamp</h1>

  <label for="name">Escribe tu nombre</label>
  <input id="name" type="text" placeholder="Tu nombre..." autocomplete="off">

  <p id="greeting">Hello</p>

  <script>
    const input = document.getElementById("name");
    const greeting = document.getElementById("greeting");

    input.addEventListener("input", () => {
      const value = input.value.trim();
      greeting.textContent = value ? `Hello ${value}` : "Hello";
    });
  </script>
</body>
</html>
